services:
  web:
    image: flow-lab:local
    build:
      context: .
      args:
        VITE_GA_MEASUREMENT_ID: "${VITE_GA_MEASUREMENT_ID:-}"
        VITE_GA_DEBUG: "${VITE_GA_DEBUG:-false}"
        VITE_GA_ENABLE_LOCAL: "${VITE_GA_ENABLE_LOCAL:-false}"
    ports:
      - "${FLOWLAB_PORT:-8087}:8087"
    restart: unless-stopped
